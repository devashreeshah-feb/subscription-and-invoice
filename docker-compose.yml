version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: subflow
      POSTGRES_PASSWORD: subflow_password
      POSTGRES_DB: subflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # We will add backend and celery workers here later

volumes:
  postgres_data:
